name: First Contact Station smoke test
on:
  push:
    paths:
      - '.github/workflows/first-contact-station-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe invitation, submit ONE synthetic message, verify response
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error,urllib.parse,sys,uuid
          BASE='https://kozintcev.art'
          H={'User-Agent':'FirstContactStationSmoke/1.1','Accept':'application/json'}
          def send(url,data=None,headers=None):
           req=urllib.request.Request(url,data=data,headers={**H,**(headers or {})},method='POST' if data is not None else 'GET')
           try:
            with urllib.request.urlopen(req,timeout=20) as resp:
             return resp.status,json.loads(resp.read(100000))
           except urllib.error.HTTPError as e:
            return e.code,{'error':e.read(600).decode('utf-8','replace')}
          for path in ('/.well-known/first-contact.json','/first-contact/'):
           status,info=send(BASE+path)
           print('DISCOVERY',path,'STATUS',status,'JSON',isinstance(info,dict),flush=True)
           if status==200 and isinstance(info,dict) and 'reply' in info:
            invitation=info
          if 'invitation' not in globals():sys.exit('INVITATION_NOT_AVAILABLE')
          reply=invitation['reply']
          endpoint=reply.get('url')
          if reply.get('method')!='POST' or not isinstance(endpoint,str) or urllib.parse.urlparse(endpoint).hostname!='kozintcev.art' or not endpoint.startswith('https://'):
           sys.exit('UNSAFE_OR_MISSING_REPLY_ENDPOINT')
          test_id='smoke-'+str(uuid.uuid4())[:8]
          payload=dict(reply.get('example_body') or {})
          payload.update({'name':'Station Connectivity Test','mode':'autonomous','message':'Synthetic diagnostic message '+test_id+' from an authorized external-agent simulation. Please ignore.'})
          status,data=send(endpoint,json.dumps(payload).encode('utf-8'),{'Content-Type':'application/json'})
          print('POST_STATUS',status,'TEST_ID',test_id,'RESPONSE_TOP_LEVEL_KEYS',list(data) if isinstance(data,dict) else [],flush=True)
          if status!=202:
           print('POST_ERROR',str(data)[:400]);sys.exit('EXPECTED_202_NOT_RECEIVED')
          conv=data.get('conversation',{}) if isinstance(data,dict) else {}
          cid=conv.get('id');key=conv.get('key');poll=conv.get('poll_url')
          print('CONVERSATION_ID',cid,'HAS_PRIVATE_KEY',bool(key),'HAS_POLL_URL',bool(poll),flush=True)
          if not (cid and key and poll):sys.exit('MISSING_PRIVATE_CONVERSATION_FIELDS')
          if not poll.startswith(BASE+'/wp-json/first-contact/v1/conversations/'):sys.exit('UNEXPECTED_POLL_URL')
          read_status,read_data=send(poll,headers={'X-First-Contact-Key':str(key)})
          print('READ_BACK_STATUS',read_status,'RESPONSE_KEYS',list(read_data) if isinstance(read_data,dict) else [],flush=True)
          if read_status!=200:sys.exit('READ_BACK_FAILED')
          bad_status,_=send(poll,headers={'X-First-Contact-Key':'intentionally-wrong-test-key'})
          print('WRONG_KEY_STATUS',bad_status,flush=True)
          if bad_status not in (401,403,404):sys.exit('WRONG_KEY_WAS_NOT_REJECTED')
          print('SMOKE_TEST_PASS',test_id,flush=True)
          PY