name: First Contact Station smoke test
on:
  push:
    paths:
      - '.github/workflows/first-contact-station-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe invitation, submit ONE synthetic message, verify response
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error, urllib.parse, sys, uuid
          BASE='https://kozintcev.art'
          HEADERS={'User-Agent':'FirstContactStationSmoke/1.0','Accept':'application/json, text/html;q=0.8'}
          def get(path):
              req=urllib.request.Request(BASE+path,headers=HEADERS)
              try:
                  with urllib.request.urlopen(req,timeout=18) as r:
                      body=r.read(100000).decode('utf-8','replace')
                      print('GET',path,'STATUS',r.status,'BYTES',len(body))
                      return r.status, body
              except urllib.error.HTTPError as e:
                  print('GET',path,'HTTP_ERROR',e.code); return e.code,''
              except Exception as e:
                  print('GET',path,'NETWORK_ERROR',type(e).__name__,str(e)[:160]); return 0,''
          results={}
          for path in ('/.well-known/first-contact.json','/first-contact/'):
              results[path]=get(path)
          candidates=[]
          def scan(obj,key=''):
              if isinstance(obj,dict):
                  for k,v in obj.items():scan(v,(key+'.' if key else '')+str(k))
              elif isinstance(obj,list):
                  for v in obj:scan(v,key)
              elif isinstance(obj,str):
                  val=obj.strip()
                  if ('endpoint' in key.lower() or 'submit' in key.lower() or 'message' in key.lower() or 'contact' in key.lower() or 'api' in key.lower()) and (val.startswith('https://') or val.startswith('/')):
                      candidates.append((key,val))
          for path,(status,body) in results.items():
              if not status or not body:continue
              try:
                  obj=json.loads(body); print('JSON_TOP_LEVEL_KEYS',path,list(obj)[:30] if isinstance(obj,dict) else type(obj).__name__); print('PUBLIC_REPLY_INSTRUCTIONS',json.dumps(obj.get('reply'),ensure_ascii=False)[:3500] if isinstance(obj,dict) else '');print('PUBLIC_CONVERSATION_INSTRUCTIONS',json.dumps(obj.get('conversation'),ensure_ascii=False)[:2000] if isinstance(obj,dict) else '');scan(obj)
              except ValueError:
                  print('HTML_PAGE',path,'FORM_COUNT',body.lower().count('<form'))
                  for url in re.findall(r'https?://kozintcev\.art/[\w\-./?=&]+',body):
                      if '/wp-json/' in url and ('contact' in url or 'message' in url):candidates.append(('html',url))
          if not candidates:
              print('NO_DECLARED_MESSAGE_ENDPOINT; synthetic POST deliberately NOT attempted')
              sys.exit(2)
          print('POTENTIAL_ENDPOINT_KEYS',[k for k,v in candidates][:15])
          allowed=[]
          for key,value in candidates:
              url=urllib.parse.urljoin(BASE,value)
              parsed=urllib.parse.urlparse(url)
              if parsed.scheme=='https' and parsed.hostname=='kozintcev.art' and (('reply.' in key.lower() or 'conversation.' in key.lower()) and ('/wp-json/' in url or '/api/' in url)):
                  allowed.append((key,url))
          if len(set(u for k,u in allowed))!=1:
              print('AMBIGUOUS_CONTACT_ENDPOINTS',len(set(u for k,u in allowed)),': no POST sent')
              sys.exit(3)
          endpoint=allowed[0][1]
          test_id='smoke-'+str(uuid.uuid4())[:8]
          data=json.dumps({'name':'Station Connectivity Test','identity':'Simulated external AI agent (authorized smoke test)','message':'Diagnostic test '+test_id+'. Please ignore. No human reply necessary.','subject':'Station Connectivity Test'}).encode()
          req=urllib.request.Request(endpoint,method='POST',data=data,headers={**HEADERS,'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                  result=resp.read(100000).decode('utf-8','replace')
                  print('POST_STATUS',resp.status,'ENDPOINT_PATH',urllib.parse.urlparse(endpoint).path,'RESPONSE_BYTES',len(result))
                  payload=json.loads(result)
          except urllib.error.HTTPError as e:
              print('POST_HTTP_ERROR',e.code,e.read(350).decode('utf-8','replace'));sys.exit(4)
          except Exception as e:
              print('POST_NETWORK_ERROR',type(e).__name__,str(e)[:160]);sys.exit(5)
          print('RESPONSE_KEYS',list(payload) if isinstance(payload,dict) else type(payload).__name__)
          print('HAS_CONVERSATION_KEY',any('key' in k.lower() or 'token' in k.lower() for k in payload) if isinstance(payload,dict) else False)
          print('TEST_ID',test_id)
          if resp.status not in (200,201,202):sys.exit(6)
          PY