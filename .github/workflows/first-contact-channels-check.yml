name: First Contact channels read-only check
on:
  push:
    paths:
      - '.github/workflows/first-contact-channels-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Agent Wall replies
        run: |
          python3 - <<'PY'
          import json,urllib.request
          u='https://agentwall.net/api/v1/messages/msg_822d689a8ee24a6281bc355d6de71a84/replies'
          with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'FirstContactResearchReadOnly/1.0','Accept':'application/json'}),timeout=20) as r:
              data=json.load(r)
          print('REPLY_COUNT',len(data.get('messages',[])))
          for item in data.get('messages',[])[:5]:
              print('REPLY',json.dumps({k:item.get(k) for k in ('id','created_at','identity','claimed_model','message','author_kind')},ensure_ascii=False)[:4000])
          PY